name: QA Chain（ddd-qa-chain）

# 2026-11-28 审计 D-6：docs/** 与根 *.md 纳入触发路径——否则纯文档 PR 不会跑新的 Format check
on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/qa.yml'
      - '.prettierrc.json'
      - 'lefthook.yml'
      - '.npmrc'
  # 2026-11-28 审计：原仅 push——PR 阶段无门禁（CONTRIBUTING 要求「CI 绿才收口」）
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/qa.yml'
      - '.prettierrc.json'
      - 'lefthook.yml'
      - '.npmrc'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '跑 L4 真实 E2E（需 NF_TEST_KEY）'
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # secrets 不能出现在 if: 中（GitHub: Unrecognized named-value: 'secrets'）
      HAS_NF_TEST_KEY: ${{ secrets.NF_TEST_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install deps
        working-directory: apps/desktop
        run: npm ci

      # Playwright 浏览器（L3 交互测试需要——GitHub runner 无缓存）
      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      # B1 lint 门禁（快且确定项——pre-commit 增量 + CI 全量兜底）
      - name: Lint（ESLint 全量）
        working-directory: apps/desktop
        run: npx eslint .

      # B1 格式化一致性（CI 全量校验——pre-commit 已增量修复；含 repo-root 配置文件自身）
      # 2026-11-28 审计 D-6：docs/**/*.md 与仓库根 *.md 一并纳入——此前 lint-staged 只覆盖
      # apps/desktop，docs 的 Markdown 既不在提交前格式化也不在 CI 检查（存量 157 个文件一次性重排）
      - name: Format check（Prettier）
        working-directory: apps/desktop
        run: >-
          npx prettier --check
          "src/**/*.{ts,tsx}" "tests/**/*.{ts,tsx}" "*.mjs" "*.config.*" "eslint.config.js"
          "../../docs/**/*.md" "../../*.md"
          "../../.prettierrc.json" "../../lefthook.yml" "../../.github/workflows/qa.yml"

      # L1 领域逻辑（确定性——CI 必跑）
      - name: L1 领域逻辑（Vitest）
        working-directory: apps/desktop
        run: npx vitest run

      # L2 契约（类型安全——CI 必跑；双 tsconfig：默认 = renderer+domain，main = 主进程+preload，
      # 2026-11-28 审计：原仅跑默认 tsc → src/main 从未被 CI 类型检查，主进程类型错误可合入而不被发现）
      - name: L2 契约（tsc --noEmit，双 tsconfig）
        working-directory: apps/desktop
        run: npx tsc -p tsconfig.json --noEmit && npx tsc -p tsconfig.main.json --noEmit

      # L2b 测试类型（tsconfig.tests.json：tests/unit 与其引用的 src 一起检查；
      # 2026-11-28 审计 D-4：单测原先不在任何 tsconfig include 里——测试里的类型错误只能靠运气发现）
      - name: L2b 测试类型（tsc -p tsconfig.tests.json）
        working-directory: apps/desktop
        run: npx tsc -p tsconfig.tests.json --noEmit

      # L3 组件交互（纯 DOM 断言无截图——跨平台稳定，CI 必跑；ddd-qa-chain 缺层 2026-08-02 补）
      - name: L3 组件交互（Playwright interaction）
        working-directory: apps/desktop
        run: npx playwright test --project=interaction

      # L4 真实 E2E（需 API key——仅手动触发）
      - name: L4 体验（e2e-suite——手动）
        if: inputs.run_e2e == true && env.HAS_NF_TEST_KEY == 'true'
        working-directory: apps/desktop
        env:
          NF_TEST_KEY: ${{ secrets.NF_TEST_KEY }}
        run: node e2e-suite.mjs && node e2e-supplement.mjs

      # 备注：L5 视觉回归建议本地跑（像素基线跨平台差异——Linux vs macOS 渲染不同）
      # 如需 CI 视觉：单独 job 用 ubuntu 生成/对比 Linux 基线（snapshots-linux）
