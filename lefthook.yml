# NeonForge git hooks（B1——流程重构阶段 1）
# 门禁策略（process-industry-research-20260816 §四 P1-3）：只拦「快且确定」项——
# pre-commit = lint-staged 增量 lint/format（秒级）；复杂度（全量 lint/L1-L3/CI）交 GitHub Actions。
# 安装：npx lefthook install（写入 .git/hooks）
pre-commit:
  parallel: true
  commands:
    lint-staged:
      root: apps/desktop
      glob: '*.{ts,tsx,mjs,js,json,md,yml,yaml}'
      run: npx lint-staged
    # AGENTS.md 脱敏闸（规则见 AGENTS.md 脱敏条）：只扫本次暂存的新增行，脚本自取索引（不依赖 {staged_files} 的路径形状）
    desens:
      glob: '*.{md,ts,tsx,mjs,cjs,js,json,yml,yaml,py,sh,toml}'
      run: python3 tools/desens-scan.py
